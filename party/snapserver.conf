# House Party: iPhone -> AirPlay ("House Party", served by the Mac mini on 5 GHz WiFi)
# -> snapserver -> one local snapclient per Bluetooth speaker (BlueALSA).
[server]
threads = -1

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[stream]
bind_to_address = 0.0.0.0
port = 1704
source = airplay:///opt/party/shairport-nocover.sh?name=party&devicename=House Party&port=5000
codec = flac
buffer = 1500
send_to_muted = false

[logging]

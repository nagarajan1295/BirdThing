# House Party: iPhone -> AirPlay ("House Party", served by the living-room BirdThing Pi on
# 5 GHz WiFi) -> snapserver -> one snapclient per Bluetooth speaker on the bedroom Pi.
[server]
threads = -1

[http]
enabled = true
bind_to_address = 0.0.0.0
port = 1780

[tcp]
enabled = true
bind_to_address = 0.0.0.0
port = 1705

[stream]
bind_to_address = 0.0.0.0
port = 1704
source = airplay:///usr/bin/shairport-sync?name=party&devicename=House Party&port=5000
codec = flac
buffer = 1500
send_to_muted = false

[logging]

# House Party: the Pi is ONLY an A2DP source (like a phone). With a sink role on
# offer, the Echo Dot connected "backwards" and sent its own audio to the Pi.
# 44.1 kHz = AirPlay's native rate (no resampling); software volume so the
# speakers' own volume (set by voice) is left alone.
[Service]
ExecStart=
ExecStart=/usr/bin/bluealsa -p a2dp-source --a2dp-force-audio-cd --keep-alive=30 --sbc-quality=high

# House Party: BlueALSA needs bluetoothd's a2dp plugin (Media1 API). AVRCP/SAP
# stay off, and BlueALSA is source-only, so the iPhone still gets no audio role
# on this host (the reason 10-ancs-noaudio.conf disabled a2dp in the first place).
[Service]
ExecStart=
ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=avrcp,sap

name: bridgething ci

on:
  pull_request:
    paths: ['bridgething/**']
  push:
    branches: [master]
    paths: ['bridgething/**']

permissions:
  contents: read

defaults:
  run:
    working-directory: bridgething

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: bridgething/.bun-version

      - run: bun install --frozen-lockfile

      - name: build, bundle and validate the catalog
        env:
          CHECK_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: bun run check
